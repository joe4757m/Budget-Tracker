<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BudgetTracker — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #222222;
      --border: #2e2e2e;
      --accent: #c8f060;
      --accent-dark: #a8d040;
      --text: #f0f0f0;
      --text-muted: #888;
      --error: #ff6b6b;
      --success: #6bffb8;
      --radius: 12px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background blobs */
    .bg-blobs {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      animation: float 8s ease-in-out infinite;
    }

    .blob-1 {
      width: 400px; height: 400px;
      background: var(--accent);
      top: -100px; left: -100px;
      animation-delay: 0s;
    }

    .blob-2 {
      width: 300px; height: 300px;
      background: #60a0f0;
      bottom: -80px; right: -80px;
      animation-delay: -3s;
    }

    .blob-3 {
      width: 200px; height: 200px;
      background: #f060c8;
      top: 50%; left: 60%;
      animation-delay: -5s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(20px, -20px) scale(1.05); }
      66% { transform: translate(-15px, 15px) scale(0.95); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 16px;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-logo {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .brand-logo span {
      color: var(--accent);
    }

    .brand-tagline {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      backdrop-filter: blur(10px);
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--surface2);
      border-radius: var(--radius);
      padding: 4px;
      margin-bottom: 28px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0f0f0f;
    }

    /* Forms */
    .form { display: none; flex-direction: column; gap: 16px; }
    .form.active { display: flex; animation: fadeIn 0.3s ease both; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(8px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .field { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200, 240, 96, 0.1);
    }

    input::placeholder { color: #555; }

    .btn {
      padding: 13px;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: #0f0f0f;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 4px;
    }

    .btn:hover { background: var(--accent-dark); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-loading::after {
      content: '';
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #0f0f0f;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .alert {
      padding: 12px 14px;
      border-radius: var(--radius);
      font-size: 0.875rem;
      display: none;
    }

    .alert.error { background: rgba(255, 107, 107, 0.12); border: 1px solid rgba(255, 107, 107, 0.3); color: var(--error); display: block; }
    .alert.success { background: rgba(107, 255, 184, 0.12); border: 1px solid rgba(107, 255, 184, 0.3); color: var(--success); display: block; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
  </style>
</head>
<body>

  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="container">
    <div class="brand">
      <div class="brand-logo">Budget<span>Tracker</span></div>
      <div class="brand-tagline">Take control of your finances</div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Alert -->
      <div class="alert" id="alert"></div>

      <!-- Login Form -->
      <form class="form active" id="login-form" onsubmit="handleLogin(event)">
        <div class="field">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" placeholder="your username" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn" id="login-btn">Sign In</button>
      </form>

      <!-- Register Form -->
      <form class="form" id="register-form" onsubmit="handleRegister(event)">
        <div class="field">
          <label for="reg-username">Username</label>
          <input type="text" id="reg-username" placeholder="choose a username" required />
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" placeholder="min. 8 characters" required minlength="8" />
        </div>
        <div class="field">
          <label for="reg-password2">Confirm Password</label>
          <input type="password" id="reg-password2" placeholder="repeat password" required />
        </div>
        <button type="submit" class="btn" id="register-btn">Create Account</button>
      </form>
    </div>
  </div>

  <script>
    const API = 'http://127.0.0.1:8000/api';

    // Redirect if already logged in
    if (localStorage.getItem('access_token')) {
      window.location.href = 'dashboard.html';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
      });
      document.getElementById('login-form').classList.toggle('active', tab === 'login');
      document.getElementById('register-form').classList.toggle('active', tab === 'register');
      hideAlert();
    }

    function showAlert(message, type = 'error') {
      const alert = document.getElementById('alert');
      alert.textContent = message;
      alert.className = `alert ${type}`;
    }

    function hideAlert() {
      document.getElementById('alert').className = 'alert';
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.classList.toggle('btn-loading', loading);
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideAlert();
      setLoading('login-btn', true);

      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch(`${API}/users/login/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          showAlert(data.detail || 'Invalid username or password.');
          return;
        }

        localStorage.setItem('access_token', data.access);
        localStorage.setItem('refresh_token', data.refresh);
        window.location.href = 'dashboard.html';

      } catch (err) {
        showAlert('Could not connect to server. Is Django running?');
      } finally {
        setLoading('login-btn', false);
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideAlert();

      const password = document.getElementById('reg-password').value;
      const password2 = document.getElementById('reg-password2').value;

      if (password !== password2) {
        showAlert('Passwords do not match.');
        return;
      }

      setLoading('register-btn', true);

      const body = {
        username: document.getElementById('reg-username').value,
        email: document.getElementById('reg-email').value,
        password,
        password2
      };

      try {
        const res = await fetch(`${API}/users/register/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await res.json();

        if (!res.ok) {
          const msg = Object.values(data).flat().join(' ');
          showAlert(msg);
          return;
        }

        localStorage.setItem('access_token', data.access);
        localStorage.setItem('refresh_token', data.refresh);
        window.location.href = 'dashboard.html';

      } catch (err) {
        showAlert('Could not connect to server. Is Django running?');
      } finally {
        setLoading('register-btn', false);
      }
    }
  </script>

</body>
</html>
