<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BudgetTracker — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #222222;
      --border: #2e2e2e;
      --accent: #c8f060;
      --accent-dark: #a8d040;
      --text: #f0f0f0;
      --text-muted: #888;
      --error: #ff6b6b;
      --success: #6bffb8;
      --radius: 12px;
      --income-color: #6bffb8;
      --expense-color: #ff6b6b;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Navbar */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
    }

    .brand span { color: var(--accent); }

    .nav-links {
      display: flex;
      gap: 8px;
    }

    .nav-link {
      padding: 8px 16px;
      border-radius: var(--radius);
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .nav-link:hover { color: var(--text); background: var(--surface2); }
    .nav-link.active { color: var(--accent); background: rgba(200, 240, 96, 0.08); }

    .nav-right { display: flex; align-items: center; gap: 12px; }

    .username {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .btn-logout {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: transparent;
      color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover { border-color: var(--error); color: var(--error); }

    /* Main content */
    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* Header */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .page-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.8rem;
    }

    .month-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .month-selector select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
      padding: 8px 12px;
      outline: none;
      cursor: pointer;
    }

    /* Summary cards */
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }

    .card-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    .card-value {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
    }

    .card-value.income { color: var(--income-color); }
    .card-value.expense { color: var(--expense-color); }
    .card-value.balance { color: var(--accent); }

    .card-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Charts grid */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 28px;
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }

    .chart-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
    }

    .chart-container {
      position: relative;
      height: 240px;
    }

    /* Budget vs Actual */
    .budget-list { display: flex; flex-direction: column; gap: 14px; }

    .budget-item {}

    .budget-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .budget-item-name {
      font-size: 0.875rem;
      font-weight: 500;
    }

    .budget-item-amounts {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .budget-item-amounts span { color: var(--text); }

    .progress-bar {
      height: 6px;
      background: var(--surface2);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .progress-fill.safe { background: var(--income-color); }
    .progress-fill.warning { background: var(--accent); }
    .progress-fill.danger { background: var(--expense-color); }

    .over-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(255, 107, 107, 0.15);
      color: var(--error);
      border: 1px solid rgba(255, 107, 107, 0.3);
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--text-muted);
      gap: 10px;
    }

    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .summary-cards { grid-template-columns: 1fr; }
      .charts-grid { grid-template-columns: 1fr; }
      .navbar { padding: 12px 16px; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="brand">Budget<span>Tracker</span></div>
    <div class="nav-links">
      <a href="dashboard.html" class="nav-link active">Dashboard</a>
      <a href="transactions.html" class="nav-link">Transactions</a>
      <a href="budgets.html" class="nav-link">Budgets</a>
      <a href="categories.html" class="nav-link">Categories</a>
    </div>
    <div class="nav-right">
      <span class="username" id="username-display"></span>
      <button class="btn-logout" onclick="handleLogout()">Sign Out</button>
    </div>
  </nav>

  <!-- Main -->
  <main class="main">
    <div class="page-header">
      <h1 class="page-title">Dashboard</h1>
      <div class="month-selector">
        <select id="month-select" onchange="loadDashboard()">
          <option value="1">January</option>
          <option value="2">February</option>
          <option value="3">March</option>
          <option value="4">April</option>
          <option value="5">May</option>
          <option value="6">June</option>
          <option value="7">July</option>
          <option value="8">August</option>
          <option value="9">September</option>
          <option value="10">October</option>
          <option value="11">November</option>
          <option value="12">December</option>
        </select>
        <select id="year-select" onchange="loadDashboard()"></select>
      </div>
    </div>

    <!-- Summary Cards -->
    <div class="summary-cards">
      <div class="card">
        <div class="card-label">Total Income</div>
        <div class="card-value income" id="total-income">—</div>
        <div class="card-sub">This month</div>
      </div>
      <div class="card">
        <div class="card-label">Total Expenses</div>
        <div class="card-value expense" id="total-expenses">—</div>
        <div class="card-sub">This month</div>
      </div>
      <div class="card">
        <div class="card-label">Balance</div>
        <div class="card-value balance" id="balance">—</div>
        <div class="card-sub">Income − Expenses</div>
      </div>
    </div>

    <!-- Charts -->
    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-title">Spending by Category</div>
        <div class="chart-container">
          <canvas id="categoryChart"></canvas>
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Income vs Expenses</div>
        <div class="chart-container">
          <canvas id="overviewChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Budget vs Actual -->
    <div class="chart-card">
      <div class="chart-title">Budget vs Actual Spending</div>
      <div id="budget-list" class="budget-list">
        <div class="loading"><div class="spinner"></div> Loading...</div>
      </div>
    </div>
  </main>

  <script>
    const API = 'http://127.0.0.1:8000/api';
    let categoryChart = null;
    let overviewChart = null;

    // Auth check
    const token = localStorage.getItem('access_token');
    if (!token) window.location.href = 'index.html';

    // Populate year selector
    const yearSelect = document.getElementById('year-select');
    const currentYear = new Date().getFullYear();
    for (let y = currentYear; y >= currentYear - 3; y--) {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y;
      yearSelect.appendChild(opt);
    }

    // Set current month
    document.getElementById('month-select').value = new Date().getMonth() + 1;

    async function apiFetch(url) {
      const res = await fetch(url, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.status === 401) {
        localStorage.clear();
        window.location.href = 'index.html';
      }
      return res.json();
    }

    function formatCurrency(amount) {
      return new Intl.NumberFormat('en-US', {
        style: 'currency', currency: 'USD'
      }).format(amount);
    }

    async function loadDashboard() {
      const month = document.getElementById('month-select').value;
      const year = document.getElementById('year-select').value;

      const data = await apiFetch(`${API}/dashboard/?month=${month}&year=${year}`);

      // Summary cards
      document.getElementById('total-income').textContent = formatCurrency(data.total_income);
      document.getElementById('total-expenses').textContent = formatCurrency(data.total_expenses);
      const balance = parseFloat(data.balance);
      const balanceEl = document.getElementById('balance');
      balanceEl.textContent = formatCurrency(balance);
      balanceEl.style.color = balance >= 0 ? 'var(--income-color)' : 'var(--expense-color)';

      // Category pie chart
      const categories = data.spending_by_category;
      const catColors = ['#c8f060','#6bffb8','#60a0f0','#f060c8','#f0a060','#60f0f0','#a060f0'];

      if (categoryChart) categoryChart.destroy();
      categoryChart = new Chart(document.getElementById('categoryChart'), {
        type: 'doughnut',
        data: {
          labels: categories.length ? categories.map(c => c.category__name || 'Uncategorized') : ['No data'],
          datasets: [{
            data: categories.length ? categories.map(c => c.total) : [1],
            backgroundColor: categories.length ? catColors.slice(0, categories.length) : ['#2e2e2e'],
            borderWidth: 0,
            hoverOffset: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#888', font: { family: 'DM Sans', size: 12 }, padding: 16, boxWidth: 12 }
            }
          },
          cutout: '65%'
        }
      });

      // Income vs Expenses bar chart
      if (overviewChart) overviewChart.destroy();
      overviewChart = new Chart(document.getElementById('overviewChart'), {
        type: 'bar',
        data: {
          labels: ['This Month'],
          datasets: [
            {
              label: 'Income',
              data: [data.total_income],
              backgroundColor: 'rgba(107, 255, 184, 0.7)',
              borderRadius: 8,
              borderSkipped: false
            },
            {
              label: 'Expenses',
              data: [data.total_expenses],
              backgroundColor: 'rgba(255, 107, 107, 0.7)',
              borderRadius: 8,
              borderSkipped: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: { color: '#888', font: { family: 'DM Sans', size: 12 }, padding: 16, boxWidth: 12 }
            }
          },
          scales: {
            x: { ticks: { color: '#888' }, grid: { color: '#2e2e2e' } },
            y: { ticks: { color: '#888', callback: v => '$' + v }, grid: { color: '#2e2e2e' } }
          }
        }
      });

      // Budget vs actual
      const budgetList = document.getElementById('budget-list');
      if (!data.budget_vs_actual.length) {
        budgetList.innerHTML = '<div class="empty">No budgets set for this month.</div>';
        return;
      }

      budgetList.innerHTML = data.budget_vs_actual.map(b => {
        const pct = Math.min((b.spent / b.limit) * 100, 100);
        const fillClass = pct >= 100 ? 'danger' : pct >= 80 ? 'warning' : 'safe';
        return `
          <div class="budget-item">
            <div class="budget-item-header">
              <span class="budget-item-name">${b.category}</span>
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="budget-item-amounts">
                  <span>${formatCurrency(b.spent)}</span> / ${formatCurrency(b.limit)}
                </span>
                ${b.is_over ? '<span class="over-badge">Over budget</span>' : ''}
              </div>
            </div>
            <div class="progress-bar">
              <div class="progress-fill ${fillClass}" style="width:${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function handleLogout() {
      const refresh = localStorage.getItem('refresh_token');
      try {
        await fetch(`${API}/users/logout/`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ refresh })
        });
      } finally {
        localStorage.clear();
        window.location.href = 'index.html';
      }
    }

    // Load username from token payload
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      document.getElementById('username-display').textContent = `Hi, user #${payload.user_id}`;
    } catch {}

    loadDashboard();
  </script>

</body>
</html>
